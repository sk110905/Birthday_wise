<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#392044">
  <title>Birthday Time 🎂</title>
  <link rel="stylesheet" href="page2.css">
</head>
<body>
  <main class="page page-two">
    <div class="particles" aria-hidden="true"></div>
    <div class="aurora aurora-left" aria-hidden="true"></div>
    <div class="aurora aurora-right" aria-hidden="true"></div>

    <section class="reveal-card" aria-labelledby="birthday-title">
      <div class="top-note"><span class="line"></span><span>THE SECRET IS OUT · ANKITA</span><span class="line"></span></div>
      <h1 id="birthday-title">Happy Birthday<span class="cake-emoji" aria-hidden="true">🎂</span></h1>
      <p class="reveal-copy">Today is all about someone truly special… Ankita, you make the world a little brighter just by being here.</p>

      <div class="celebration-scene" role="img" aria-label="A birthday cake surrounded by balloons and confetti">
        <div class="balloon balloon-pink"><span></span></div>
        <div class="balloon balloon-gold"><span></span></div>
        <div class="balloon balloon-lilac"><span></span></div>
        <div class="cake-plate"></div>
        <div class="cake">
          <div class="candle"><i></i></div>
          <div class="icing"><b></b><b></b><b></b></div>
          <div class="cake-layer cake-top"></div>
          <div class="cake-layer cake-bottom"></div>
          <div class="sprinkle s1"></div><div class="sprinkle s2"></div><div class="sprinkle s3"></div>
        </div>
        <span class="confetti confetti-a">✦</span><span class="confetti confetti-b">•</span><span class="confetti confetti-c">✧</span>
      </div>

      <button class="primary-button next-button" type="button" data-next="page3.html">
        <span>Let the magic begin</span><span class="button-arrow" aria-hidden="true">✦</span>
      </button>
      <p class="hint">There are still a few memories to unwrap</p>
    </section>
  </main>
  <script src="page2.js"></script>
</body>
</html>
