<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3c1d3f">
  <title>A Little Surprise ✨</title>
  <link rel="stylesheet" href="page1.css">
</head>
<body>
  <main class="page page-one" id="page-one">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="particles" aria-hidden="true"></div>

    <section class="story-card" aria-labelledby="surprise-title">
      <p class="eyebrow">A tiny question for Ankita</p>
      <h1 id="surprise-title">Is today a<br><em>special day?</em></h1>
      <p class="subtitle">Hmm… I think today might be a little more special than usual. <span aria-hidden="true">✨</span></p>

      <div class="gift-scene" aria-label="An open glowing birthday gift box" role="img">
        <div class="glow-ring"></div>
        <div class="gift-lid-open"><span class="lid-ribbon"></span></div>
        <div class="gift-box-open"><span class="box-ribbon"></span><span class="box-heart">♥</span><span class="gift-shine"></span></div>
        <span class="gift-tag">for<br>you</span>
        <span class="gift-sparkle sparkle-one">✦</span><span class="gift-sparkle sparkle-two">✧</span>
      </div>

      <button class="primary-button next-button" type="button" data-next="page2.html">
        <span>Open the surprise</span><span class="button-arrow" aria-hidden="true">→</span>
      </button>
      <p class="hint">Your little adventure starts here</p>
    </section>
  </main>
  <script src="page1.js"></script>
</body>
</html>
