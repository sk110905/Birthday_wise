<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b1c42">
  <title>Happy Birthday, Ankita 💗</title>
  <link rel="stylesheet" href="page4.css">
</head>
<body>
  <main class="page page-four">
    <div class="stars" aria-hidden="true"></div>
    <div class="moon-glow" aria-hidden="true"></div>
    <div class="particles" aria-hidden="true"></div>

    <section class="letter-wrap" aria-labelledby="final-title">
      <p class="eyebrow">A birthday wish, just for you</p>
      <div class="heart-seal" aria-hidden="true">♥</div>
      <h1 id="final-title">Happy Birthday,<br><em>Ankita</em> <span aria-hidden="true">🎂💗</span></h1>
      <div class="letter-rule"><span></span>✦<span></span></div>
      <article class="letter-card">
        <p class="letter-greeting">Happy Birthdayyy! 🎂🥳</p>
        <p id="birthday-message"></p>
      </article>
      <p class="footer-note">May this year be your softest, brightest chapter yet.</p>
      <button class="reset-button" type="button" id="reset-journey">↺ Reset the journey</button>
    </section>
  </main>
  <script src="page4.js"></script>
</body>
</html>
