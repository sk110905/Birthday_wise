<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#251432">
  <title>Beautiful Moments 💖</title>
  <link rel="stylesheet" href="page3.css">
</head>
<body>
  <main class="page page-three">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="particles" aria-hidden="true"></div>

    <section class="gallery-wrap" aria-labelledby="gallery-title">
      <div class="gallery-heading">
        <p class="eyebrow">A little album of joy for Ankita</p>
        <h1 id="gallery-title">A few beautiful<br><em>moments</em> <span aria-hidden="true">💖</span></h1>
        <p class="gallery-intro">Every lovely memory of Ankita deserves its own little place in the stars.</p>
      </div>

      <div class="gallery" aria-label="Memory gallery">
        <button class="round-button prev-button" type="button" aria-label="Previous memory" title="Previous memory">‹</button>
        <div class="card-stage" id="card-stage"></div>
        <button class="round-button next-arrow" type="button" aria-label="Next memory" title="Next memory">›</button>
      </div>

      <div class="gallery-meta"><span id="counter">1 of 5</span><span class="drag-hint">Swipe or drag to wander through the memories <span aria-hidden="true">↔</span></span></div>
      <div class="dots" id="dots" aria-label="Memory position"></div>

      <div class="final-cta" id="final-cta" hidden>
        <p>One last surprise awaits… <span aria-hidden="true">💌</span></p>
        <button class="primary-button next-button" type="button" data-next="page4.html"><span>Open your birthday letter</span><span class="button-arrow" aria-hidden="true">→</span></button>
      </div>
    </section>
  </main>
  <script src="page3.js?v=5"></script>
</body>
</html>
